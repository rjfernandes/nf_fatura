[package]
name = "nf-fatura"
version = "0.1.0"
description = "NF Fatura: clientes, NFS-e Nacional e boletos Banco Inter"
edition = "2021"

[lib]
name = "nf_fatura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "native-tls", "json", "multipart"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
async-trait = "0.1"
chrono = "0.4"
cuid2 = "0.1"
keyring = { version = "3", features = ["apple-native"] }
p12-keystore = "0.1"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
roxmltree = "0.20"
qrcode = { version = "0.14", default-features = false }
percent-encoding = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["net", "io-util"] }
